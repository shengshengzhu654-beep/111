<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>週末どこ行く？お出かけルーレット</title>
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --accent: #f59e0b;
      --bg: #f0f9ff;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #bae6fd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.55rem;
      color: var(--primary-dark);
    }

    header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 840px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.08);
    }

    /* カテゴリータブ */
    .genre-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .genre-btn {
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .genre-btn:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .genre-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 3px 10px rgba(14, 165, 233, 0.3);
    }

    /* ルーレット盤 */
    .wheel-stage {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 0 auto 16px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pointer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid #e11d48;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.25));
      z-index: 10;
    }

    canvas#wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
      background: #fff;
    }

    .center-cap {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      z-index: 5;
    }

    /* 操作ボタン */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .main-btn {
      width: 100%;
      max-width: 300px;
      padding: 15px 24px;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .main-btn:hover {
      filter: brightness(1.05);
    }

    .main-btn:active {
      transform: scale(0.97);
    }

    .main-btn.stop-mode {
      background: linear-gradient(135deg, #e11d48, #be123c);
      box-shadow: 0 6px 16px rgba(225, 29, 72, 0.35);
    }

    .main-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .sub-options {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .sub-options label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    /* 右側：候補リスト管理 */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .list-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .count-badge {
      background: #e0f2fe;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .add-row input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .add-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .add-row button {
      padding: 9px 14px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700;
    }

    .item-sub {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-tag {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: #e0f2fe;
      color: #0369a1;
      flex-shrink: 0;
    }

    .del-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 1.05rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .del-btn:hover {
      color: #e11d48;
      background: #ffe4e6;
    }

    .list-footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .ghost-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* 結果モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 22px;
      padding: 26px 22px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-badge {
      display: inline-block;
      background: #e0f2fe;
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 0.82rem;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .modal h3 {
      margin: 6px 0 6px;
      font-size: 1.5rem;
      line-height: 1.35;
      color: var(--text);
    }

    .modal-place {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: var(--muted);
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-link {
      display: block;
      text-decoration: none;
      background: #16a34a;
      color: #fff;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 12px;
    }

    .close-modal-btn {
      border: 1.5px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-weight: 700;
      padding: 11px 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
